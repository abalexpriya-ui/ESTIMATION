<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RB Motors - Estimation</title>
<style>
  :root{
    --ink:#1a1a1a;
    --line:#333;
    --accent:#b91c1c;
    --muted:#666;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9e9e9;
    margin:0;
    padding:20px;
    color:var(--ink);
  }
  .sheet{
    max-width:850px;
    margin:0 auto;
    background:#fff;
    border:2px solid var(--line);
    padding:24px 28px;
  }
  .header{
    text-align:center;
    border-bottom:3px double var(--line);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .header h1{
    margin:0;
    font-size:30px;
    letter-spacing:2px;
    color:var(--accent);
  }
  .header .tagline{
    font-size:13px;
    letter-spacing:1px;
    color:var(--muted);
    margin-top:2px;
  }
  .header .addr{
    font-size:12.5px;
    margin-top:6px;
    color:#333;
  }
  .title-bar{
    text-align:center;
    margin:14px 0;
  }
  .title-bar span{
    display:inline-block;
    border:1px solid var(--line);
    padding:4px 22px;
    font-weight:bold;
    letter-spacing:3px;
    font-size:16px;
  }
  .meta{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:12px;
    font-size:14px;
  }
  .meta label{
    font-weight:bold;
    margin-right:6px;
  }
  .meta input{
    border:none;
    border-bottom:1px solid var(--line);
    font-size:14px;
    padding:2px 4px;
    font-family:inherit;
  }
  .meta .date-field input{width:150px;}
  .meta .cust-field input{width:260px;}
  .vehicle{
    margin-bottom:14px;
    font-size:14px;
  }
  .vehicle label{font-weight:bold;margin-right:6px;}
  .vehicle input{
    border:none;
    border-bottom:1px solid var(--line);
    font-size:14px;
    padding:2px 4px;
    width:100%;
    font-family:inherit;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:10px;
  }
  th,td{
    border:1px solid var(--line);
    padding:6px 8px;
    font-size:13.5px;
  }
  th{
    background:#f2f2f2;
    text-align:center;
  }
  td input{
    width:100%;
    border:none;
    font-size:13.5px;
    font-family:inherit;
    text-align:center;
  }
  td.desc input{text-align:left;}
  td.amt{text-align:right;}
  td.amt input{text-align:right;}
  .row-actions{text-align:center;}
  .row-actions button{
    border:none;
    background:#eee;
    cursor:pointer;
    border-radius:3px;
    padding:2px 6px;
    font-size:12px;
  }
  .row-actions button:hover{background:#ddd;}
  .totals{
    display:flex;
    justify-content:flex-end;
    margin-top:6px;
  }
  .totals table{width:280px;}
  .totals td{font-size:14px;}
  .totals td.label{font-weight:bold;text-align:right;}
  .totals td.value{text-align:right;width:110px;}
  .totals tr.grand td{font-weight:bold;font-size:16px;border-top:2px solid var(--line);}
  .toolbar{
    max-width:850px;
    margin:14px auto 0;
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .toolbar button{
    padding:9px 18px;
    font-size:14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:600;
  }
  #addRowBtn{background:#e5e7eb;color:#111;}
  #addRowBtn:hover{background:#d1d5db;}
  #saveBtn{background:#2563eb;color:#fff;}
  #saveBtn:hover{background:#1d4ed8;}
  #printBtn{background:var(--accent);color:#fff;}
  #printBtn:hover{background:#991b1b;}
  .footer-note{
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  @media print{
    body{background:#fff;padding:0;}
    .toolbar{display:none;}
    .sheet{border:none;max-width:100%;padding:0;}
    .row-actions{display:none;}
    th.actions-col, td.row-actions{display:none;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="header">
    <h1>RB MOTORS</h1>
    <div class="tagline">MULTI BRAND CAR CARE</div>
    <div class="addr">
      No. 109-B Keela Ambigapuram, Kalkandar Kottai Main Road, Trichy - 620004<br>
      Mobile: 8778734866, 9080352608 &nbsp;|&nbsp; 0431-2444771
    </div>
  </div>

  <div class="title-bar"><span>ESTIMATION</span></div>

  <div class="meta">
    <div class="date-field">
      <label>DATE:</label>
      <input type="date" id="estDate">
    </div>
    <div class="cust-field">
      <label>CUSTOMER NAME:</label>
      <input type="text" id="custName" placeholder="Enter customer name">
    </div>
  </div>

  <div class="vehicle">
    <label>VEHICLE DETAILS:</label>
    <input type="text" id="vehicleDetails" placeholder="Make, model, registration number">
  </div>

  <table id="itemsTable">
    <thead>
      <tr>
        <th style="width:6%;">SL NO</th>
        <th style="width:32%;">DESCRIPTION</th>
        <th style="width:12%;">QTY</th>
        <th style="width:17%;">RATE</th>
        <th style="width:17%;">TOTAL AMOUNT</th>
        <th class="actions-col" style="width:8%;"></th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <!-- rows injected by JS -->
    </tbody>
  </table>

  <div class="totals">
    <table>
      <tr>
        <td class="label">GRAND TOTAL</td>
        <td class="value" id="grandTotal">0.00</td>
      </tr>
    </table>
  </div>

  <div class="footer-note">Thank you for choosing RB Motors. This is a computer generated estimation.</div>
</div>

<div class="toolbar">
  <button id="addRowBtn" onclick="addRow()">+ Add Row</button>
  <button id="saveBtn" onclick="window.print()">Save (as PDF)</button>
  <button id="printBtn" onclick="window.print()">Print</button>
</div>

<script>
let rowCount = 0;

function addRow(prefill){
  rowCount++;
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td style="text-align:center;">${rowCount}</td>
    <td class="desc"><input type="text" placeholder="Item / service description"></td>
    <td><input type="number" min="0" value="1" oninput="calcRow(this)"></td>
    <td><input type="number" min="0" step="0.01" value="0" oninput="calcRow(this)"></td>
    <td class="amt"><input type="text" readonly value="0.00"></td>
    <td class="row-actions"><button onclick="removeRow(this)">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function removeRow(btn){
  const tbody = document.getElementById('itemsBody');
  if(tbody.rows.length <= 1) return;
  btn.closest('tr').remove();
  renumberRows();
  calcGrandTotal();
}

function renumberRows(){
  const tbody = document.getElementById('itemsBody');
  rowCount = 0;
  [...tbody.rows].forEach(row=>{
    rowCount++;
    row.cells[0].textContent = rowCount;
  });
}

function calcRow(input){
  const tr = input.closest('tr');
  const qty = parseFloat(tr.cells[2].querySelector('input').value) || 0;
  const rate = parseFloat(tr.cells[3].querySelector('input').value) || 0;
  const total = qty * rate;
  tr.cells[4].querySelector('input').value = total.toFixed(2);
  calcGrandTotal();
}

function calcGrandTotal(){
  const tbody = document.getElementById('itemsBody');
  let grand = 0;
  [...tbody.rows].forEach(row=>{
    grand += parseFloat(row.cells[4].querySelector('input').value) || 0;
  });
  document.getElementById('grandTotal').textContent = grand.toFixed(2);
}

// initial rows
for(let i=0;i<5;i++) addRow();

// default date = today
document.getElementById('estDate').valueAsDate = new Date();
</script>

</body>
</html>
